# SPDX-License-Identifier: Apache-2.0

name: MCP lifecycle focused tests

on:
  push:
    branches: [codex/integrate-mcp-stability]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mcp-lifecycle-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-and-icon-tests:
    name: MCP lifecycle and icon metadata
    if: github.event_name == 'push' || github.head_ref == 'codex/integrate-mcp-stability'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 1
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_CODEGEN_UNITS: 1
      RUSTFLAGS: >-
        -Dwarnings -Aunreachable-pub
        -C linker=cc -C link-arg=-fuse-ld=bfd
        -C link-arg=-Wl,--no-keep-memory
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run MCP pool lifecycle integration test
        working-directory: rust
        run: >-
          cargo test --locked -j 1
          --config profile.test.package.lean-ctx.opt-level=0
          --test main mcp_pool_lifecycle -- --nocapture
      - name: Verify icon on stdio initialize and tools/list
        working-directory: rust
        run: >-
          cargo test --locked -j 1
          --config profile.test.package.lean-ctx.opt-level=0
          --test main mcp_fast_initialize_669 -- --nocapture
      - name: Run MCP pool unit tests
        working-directory: rust
        run: >-
          cargo test --locked -j 1
          --config profile.test.package.lean-ctx.opt-level=0
          --lib core::mcp_catalog::pool::tests -- --nocapture
      - name: Run icon metadata unit tests
        working-directory: rust
        run: >-
          cargo test --locked -j 1
          --config profile.test.package.lean-ctx.opt-level=0
          --lib server::server_handler::icon_metadata_tests -- --nocapture
